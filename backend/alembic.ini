# Configuração do Alembic para o backend Vibe Check.
# A URL real do banco NÃO fica aqui: é injetada em runtime por alembic/env.py
# a partir de settings.database_url (variável de ambiente DATABASE_URL).

[alembic]
script_location = alembic
prepend_sys_path = .

# Placeholder inofensivo; sobrescrito em env.py. Não é um segredo.
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
