# Ambiente local completo do Vibe Check: PostgreSQL, FastAPI e React/Vite.
# Os valores vêm de variáveis de ambiente com defaults de desenvolvimento
# (descartáveis, não são segredos). Copie .env.example para .env se quiser
# sobrescrevê-los. Nenhum segredo é versionado.

services:
  db:
    image: postgres:16-alpine
    container_name: vibe_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vibe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vibe}
      POSTGRES_DB: ${POSTGRES_DB:-vibe}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - vibe_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vibe} -d ${POSTGRES_DB:-vibe}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: vibe_backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-vibe}:${POSTGRES_PASSWORD:-vibe}@db:5432/${POSTGRES_DB:-vibe}
      MUSIC_SNAPSHOT_TTL_DAYS: ${MUSIC_SNAPSHOT_TTL_DAYS:-7}
      SPOTIFY_TOP_ITEMS_LIMIT: ${SPOTIFY_TOP_ITEMS_LIMIT:-50}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      SPOTIFY_REDIRECT_URI: ${SPOTIFY_REDIRECT_URI:-http://localhost:8000/auth/callback}
      LASTFM_API_KEY: ${LASTFM_API_KEY:-}
      FERNET_KEY: ${FERNET_KEY:-}
      # Ollama roda no host, não no container: host.docker.internal aponta para
      # fora do container Docker. Sem o serviço disponível, o LLMClient cai no
      # fallback determinístico (PB-17) — não bloqueia o backend.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    container_name: vibe_frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - vibe_frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:5173"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  vibe_pgdata:
  vibe_frontend_node_modules:
